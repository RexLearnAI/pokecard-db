<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可夢識字樂 | Pokémon Reading Fun</title>
  <style>
    :root {
      --yellow: #FFD700;
      --yellow-dark: #F5A623;
      --pokeball-red: #E53935;
      --text-dark: #1A1A2E;
      --text-mid: #555;
      --radius: 16px;
      --shadow: 0 4px 20px rgba(0,0,0,0.13);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background: #f0f4ff;
      color: var(--text-dark);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1A1A2E 0%, #16213E 100%);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    .header-brand { display: flex; align-items: center; gap: 12px; }

    .pokeball-icon {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(180deg, var(--pokeball-red) 50%, #fff 50%);
      border: 3px solid #fff; position: relative; flex-shrink: 0;
    }
    .pokeball-icon::after {
      content: ''; position: absolute;
      width: 11px; height: 11px; background: #fff;
      border: 3px solid #333; border-radius: 50%;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    .pokeball-icon::before {
      content: ''; position: absolute;
      width: 100%; height: 3px; background: #fff;
      top: 50%; left: 0; transform: translateY(-50%);
    }

    .brand-text h1 { font-size: 1.2rem; font-weight: 800; color: var(--yellow); line-height: 1.1; }
    .brand-text p  { font-size: 0.7rem; color: #aaa; letter-spacing: 0.04em; }

    #langToggle {
      background: var(--yellow); border: none; border-radius: 24px;
      padding: 7px 18px; font-size: 0.88rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s; color: #1A1A2E; font-family: inherit;
    }
    #langToggle:hover { background: var(--yellow-dark); transform: scale(1.04); }

    /* ── Set banner ── */
    #setBanner {
      background: linear-gradient(135deg, #1A1A2E, #0d3b6e);
      color: #fff; padding: 10px 20px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 6px;
    }
    .set-title    { font-size: 1rem; font-weight: 700; }
    .set-subtitle { font-size: 0.75rem; color: #aac4e8; }
    .set-count    { font-size: 0.78rem; color: #88bbdd; background: rgba(255,255,255,0.08); padding: 4px 10px; border-radius: 12px; }

    /* ── Intro tip ── */
    .intro-tip {
      background: linear-gradient(135deg, #FFD700, #FF8C00);
      padding: 9px 20px; text-align: center;
      font-size: 0.88rem; font-weight: 600; color: #1A1A2E;
    }

    /* ── Card Grid ── */
    main { padding: 16px 16px 40px; max-width: 1200px; margin: 0 auto; }

    #cardGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 14px;
    }

    /* ── Skeleton ── */
    .skeleton {
      border-radius: var(--radius); overflow: hidden;
      animation: shimmer 1.4s infinite linear;
      background: linear-gradient(90deg, #e8eaf0 25%, #d8dce8 50%, #e8eaf0 75%);
      background-size: 200% 100%;
    }
    .skeleton-card { height: 220px; }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Card Thumbnail ── */
    .card-thumb {
      background: #fff; border-radius: var(--radius);
      overflow: hidden; box-shadow: var(--shadow);
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
      border: 2px solid transparent;
    }
    .card-thumb:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 10px 28px rgba(0,0,0,0.2);
    }
    .card-thumb:active { transform: scale(0.97); }

    .card-thumb img {
      width: 100%; display: block;
      aspect-ratio: 2 / 2.8; object-fit: cover; background: #eee;
    }
    .card-thumb-label { padding: 7px 8px 9px; text-align: center; }
    .card-thumb-label .name-zh { font-size: 1rem; font-weight: 800; display: block; }
    .card-thumb-label .name-en { font-size: 0.7rem; color: #888; }

    /* ── Type badge ── */
    .type-badge {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 8px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 700; margin-top: 3px;
    }

    /* ── Modal backdrop ── */
    #backdrop {
      position: fixed; inset: 0;
      background: rgba(10,10,30,0.6); z-index: 200;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    #backdrop.active { opacity: 1; pointer-events: all; }

    /* ── Detail panel ── */
    #detailPanel {
      position: fixed; bottom: 0; left: 0; right: 0;
      max-height: 92vh; background: #fff;
      border-radius: 24px 24px 0 0; z-index: 300;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 -8px 40px rgba(0,0,0,0.25);
    }
    #detailPanel.active { transform: translateY(0); }

    .panel-handle { width: 40px; height: 5px; background: #ddd; border-radius: 3px; margin: 12px auto 0; }

    /* ── Prev / Next nav ── */
    .panel-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 14px 2px;
    }
    .nav-btn {
      background: #f0f0f0; border: none; border-radius: 20px;
      padding: 6px 14px; font-size: 0.82rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; gap: 5px;
      transition: background 0.15s, transform 0.15s; font-family: inherit;
      color: var(--text-dark);
    }
    .nav-btn:hover:not(:disabled) { background: var(--yellow); transform: scale(1.04); }
    .nav-btn:disabled { opacity: 0.3; cursor: default; }
    .nav-counter { font-size: 0.78rem; color: #aaa; font-weight: 600; }

    /* ── Panel loading spinner ── */
    .panel-spinner {
      display: flex; align-items: center; justify-content: center;
      padding: 60px 20px; flex-direction: column; gap: 14px;
    }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #eee;
      border-top-color: var(--yellow-dark); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-label { font-size: 0.85rem; color: #999; }

    /* ── Panel header ── */
    .panel-header {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 14px 18px 10px;
    }
    .panel-card-img {
      width: 110px; flex-shrink: 0; border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    @media(min-width: 600px) { .panel-card-img { width: 150px; } }

    .panel-card-info { flex: 1; min-width: 0; }
    .close-btn {
      background: #f0f0f0; border: none; width: 32px; height: 32px;
      border-radius: 50%; font-size: 1rem; cursor: pointer;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .close-btn:hover { background: #ddd; }

    .panel-name { font-size: 1.6rem; font-weight: 900; line-height: 1.1; margin-bottom: 5px; }
    .panel-hp   { font-size: 0.9rem; color: #888; margin: 5px 0; }
    .panel-hp span { font-weight: 700; color: var(--pokeball-red); font-size: 1.05rem; }
    .panel-stage { font-size: 0.75rem; color: #aaa; margin-bottom: 4px; }

    .panel-body { padding: 0 18px 32px; }

    /* ── Sections ── */
    .section-label {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: #bbb; margin: 14px 0 6px;
    }

    /* ── Readable (clickable text) ── */
    .readable {
      display: inline-flex; align-items: flex-start; gap: 8px;
      cursor: pointer; padding: 7px 10px; border-radius: 10px;
      transition: background 0.15s; width: 100%; text-align: left;
    }
    .readable:hover { background: #f4f6ff; }
    .readable.speaking { background: #fff3cd; animation: pulse 0.8s infinite; }
    @keyframes pulse {
      0%, 100% { background: #fff3cd; }
      50%       { background: #ffe080; }
    }

    .speaker-btn {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
      background: var(--yellow); border: none; cursor: pointer;
      font-size: 0.72rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s, background 0.2s; margin-top: 1px;
    }
    .speaker-btn-mandarin {
      background: #b3e5fc; color: #01579b;
    }
    .speaker-btn-mandarin:hover { background: #81d4fa !important; }
    .readable.speaking .speaker-btn { background: var(--yellow-dark); transform: scale(1.15); }
    .readable-text { flex: 1; line-height: 1.65; }

    /* ── Quiz sound buttons on flashcard back ── */
    .fc-sound-row { display: flex; gap: 10px; justify-content: center; }
    .fc-sound-btn {
      background: rgba(0,0,0,0.15); border: none; border-radius: 20px;
      padding: 6px 14px; font-size: 0.82rem; font-weight: 800;
      cursor: pointer; color: #1A1A2E; transition: background 0.15s, transform 0.15s;
      font-family: inherit;
    }
    .fc-sound-btn:hover { background: rgba(0,0,0,0.28); transform: scale(1.06); }
    .fc-sound-btn-mandarin { background: rgba(1,87,155,0.18); color: #01579b; }
    .fc-sound-btn-mandarin:hover { background: rgba(1,87,155,0.35) !important; }

    /* ── Ability block ── */
    .ability-block {
      background: linear-gradient(135deg, #fff8e1, #fff3cd);
      border: 2px solid #FFD700; border-radius: 12px;
      margin-bottom: 8px; overflow: hidden;
    }
    .ability-tag { background: #F57F17; color: #fff; font-size: 0.7rem; font-weight: 700; padding: 3px 10px; display: inline-block; }
    .ability-name .readable-text   { font-size: 1rem; font-weight: 800; }
    .ability-effect .readable-text { font-size: 0.88rem; color: var(--text-mid); }

    /* ── Attack block ── */
    .attack-block { background: #f8f9ff; border-radius: 12px; margin-bottom: 8px; padding: 2px 0; border: 1px solid #e8eaf6; }
    .attack-row   { display: flex; align-items: center; gap: 8px; padding: 4px 10px; }
    .attack-cost  { display: flex; gap: 3px; flex-shrink: 0; }
    .energy-pip {
      width: 21px; height: 21px; border-radius: 50%; font-size: 0.65rem;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; border: 2px solid rgba(0,0,0,0.12);
    }
    .attack-name-row .readable { flex: 1; }
    .attack-name-row .readable-text { font-size: 1.05rem; font-weight: 800; }
    .attack-damage { font-size: 1.35rem; font-weight: 900; color: var(--pokeball-red); flex-shrink: 0; }
    .attack-effect .readable-text { font-size: 0.86rem; color: #555; }

    /* ── Trainer / Energy card ── */
    .trainer-tag {
      display: inline-block; background: #5c6bc0; color: #fff;
      font-size: 0.72rem; font-weight: 700; padding: 3px 10px;
      border-radius: 20px; margin-bottom: 6px;
    }
    .trainer-effect .readable-text { font-size: 0.95rem; color: var(--text-mid); line-height: 1.7; }

    /* ── Stats ── */
    .stats-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
    .stat-chip { background: #f0f0f0; border-radius: 8px; padding: 5px 10px; font-size: 0.8rem; }
    .stat-chip strong { display: block; font-size: 0.65rem; color: #999; text-transform: uppercase; }

    /* ── Energy pip colors ── */
    .energy-Grass     { background: #C8E6C9; color: #1B5E20; }
    .energy-Fire      { background: #FFCCBC; color: #BF360C; }
    .energy-Water     { background: #B3E5FC; color: #01579B; }
    .energy-Lightning { background: #FFF176; color: #F57F17; }
    .energy-Psychic   { background: #E1BEE7; color: #4A148C; }
    .energy-Fighting  { background: #FFCC80; color: #E65100; }
    .energy-Darkness  { background: #CFD8DC; color: #263238; }
    .energy-Metal     { background: #E0E0E0; color: #424242; }
    .energy-Dragon    { background: #B2EBF2; color: #006064; }
    .energy-Colorless { background: #F5F5F5; color: #616161; }

    /* ── Type badge colors ── */
    .type-Grass     { background: #C8E6C9; color: #1B5E20; }
    .type-Fire      { background: #FFCCBC; color: #BF360C; }
    .type-Water     { background: #B3E5FC; color: #01579B; }
    .type-Lightning { background: #FFF176; color: #E65100; }
    .type-Psychic   { background: #E1BEE7; color: #4A148C; }
    .type-Fighting  { background: #FFCC80; color: #E65100; }
    .type-Darkness  { background: #CFD8DC; color: #263238; }
    .type-Metal     { background: #E0E0E0; color: #424242; }
    .type-Dragon    { background: #B2EBF2; color: #006064; }
    .type-Colorless { background: #F5F5F5; color: #616161; }

    /* ── Quiz button in header ── */
    #quizBtn {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
      color: #fff; border-radius: 24px; padding: 7px 14px;
      font-size: 0.82rem; font-weight: 700; cursor: pointer;
      transition: all 0.2s; font-family: inherit;
    }
    #quizBtn:hover { background: rgba(255,255,255,0.25); transform: scale(1.04); }

    /* ── Quiz overlay ── */
    #quizOverlay {
      position: fixed; inset: 0;
      background: linear-gradient(160deg, #0f0f23 0%, #1a2a4a 100%);
      z-index: 400;
      display: flex; flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    #quizOverlay.active { transform: translateY(0); }

    .quiz-top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .quiz-exit-btn {
      background: rgba(255,255,255,0.12); border: none; color: #fff;
      width: 36px; height: 36px; border-radius: 50%; font-size: 1rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .quiz-exit-btn:hover { background: rgba(255,255,255,0.28); }
    .quiz-title    { color: var(--yellow); font-size: 1.1rem; font-weight: 800; }
    .quiz-progress { color: #aac4e8; font-size: 0.85rem; font-weight: 600; min-width: 64px; text-align: right; }

    /* ── Flashcard ── */
    .flashcard-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 30px 20px; perspective: 1200px;
    }
    .flashcard {
      width: min(340px, 88vw);
      height: min(230px, 52vw, 260px);
      position: relative; transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .flashcard.flipped { transform: rotateY(180deg); }

    .flashcard-face {
      position: absolute; inset: 0; border-radius: 24px;
      backface-visibility: hidden;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    }
    .flashcard-front {
      background: linear-gradient(135deg, #1A1A2E 0%, #2d3a6e 100%);
      border: 2px solid rgba(255,215,0,0.3);
    }
    .flashcard-back {
      background: linear-gradient(135deg, #FFD700 0%, #FF8C00 100%);
      transform: rotateY(180deg);
    }
    .fc-chars {
      font-size: clamp(2.4rem, 9vw, 3.6rem);
      font-weight: 900; letter-spacing: 0.1em;
      color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    .flashcard-back .fc-chars { color: #1A1A2E; text-shadow: none; }
    .fc-hint  { color: rgba(255,255,255,0.45); font-size: 0.82rem; }
    .fc-sound { font-size: 1.5rem; }
    .fc-en    { font-size: clamp(1rem, 3.5vw, 1.35rem); font-weight: 700; color: #1A1A2E; text-align: center; padding: 0 14px; }
    .fc-tag   { background: rgba(0,0,0,0.15); color: #1A1A2E; font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; }

    /* ── Quiz nav ── */
    .quiz-nav-row {
      display: flex; justify-content: space-between;
      padding: 16px 24px 36px; gap: 12px; flex-shrink: 0;
    }
    .quiz-nav-btn {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
      color: #fff; border-radius: 24px; padding: 10px 24px;
      font-size: 0.9rem; font-weight: 700; cursor: pointer;
      transition: background 0.15s, transform 0.15s; font-family: inherit;
    }
    .quiz-nav-btn:hover:not(:disabled) { background: rgba(255,215,0,0.25); transform: scale(1.04); }
    .quiz-nav-btn:disabled { opacity: 0.25; cursor: default; }

    /* ── Error notice ── */
    .error-notice {
      background: #fff3cd; border-left: 4px solid #ffc107;
      padding: 10px 14px; border-radius: 8px;
      font-size: 0.82rem; color: #856404; margin: 12px 0;
    }

    @media (min-width: 768px) {
      #detailPanel {
        max-width: 680px; left: 50%; right: auto;
        transform: translate(-50%, 100%);
        border-radius: 24px; bottom: 24px; max-height: 88vh;
      }
      #detailPanel.active { transform: translate(-50%, 0); }
    }

    /* ── Kids Mode button ── */
    #kidsBtn {
      background: linear-gradient(135deg, #ff8f00, #e65100);
      border: none; border-radius: 24px; padding: 7px 14px;
      font-size: 0.82rem; font-weight: 700; cursor: pointer;
      transition: all 0.2s; color: #fff; font-family: inherit;
    }
    #kidsBtn:hover { transform: scale(1.06); filter: brightness(1.1); }

    /* ── Kids Mode overlay ── */
    #kidsOverlay {
      position: fixed; inset: 0;
      background: linear-gradient(160deg, #1a2a0a 0%, #0a2a1a 50%, #0a0a2a 100%);
      z-index: 410;
      display: flex; flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
    }
    #kidsOverlay.active { transform: translateY(0); }

    .kids-top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .kids-title { color: #FFD700; font-size: 1.1rem; font-weight: 800; }
    .kids-score-display { color: #aac4e8; font-size: 0.9rem; font-weight: 700; min-width: 60px; text-align: right; }

    #kidsBody {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column;
      align-items: center; padding: 16px 16px 32px;
    }

    /* ── Level selector ── */
    .kids-level-grid { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
    .kids-level-card {
      background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.15);
      border-radius: 20px; padding: 18px 20px; cursor: pointer;
      transition: background 0.2s, transform 0.2s; display: flex; align-items: center; gap: 16px;
    }
    .kids-level-card:hover:not(.kids-locked) { background: rgba(255,215,0,0.15); transform: scale(1.02); border-color: rgba(255,215,0,0.4); }
    .kids-level-card.kids-locked { opacity: 0.4; cursor: not-allowed; }
    .kids-level-icon { font-size: 2.2rem; flex-shrink: 0; }
    .kids-level-info { flex: 1; }
    .kids-level-name { font-size: 1.1rem; font-weight: 800; color: #fff; }
    .kids-level-desc { font-size: 0.8rem; color: #aac4e8; margin-top: 2px; }
    .kids-level-stars { font-size: 1.1rem; min-width: 56px; text-align: right; }
    .kids-level-lock  { font-size: 1.2rem; }

    /* ── Question screen ── */
    .kids-card-img {
      width: min(220px, 62vw); border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.55); margin-bottom: 14px;
      display: block;
    }
    .kids-question-label {
      font-size: 1.05rem; font-weight: 700; color: rgba(255,255,255,0.85);
      text-align: center; margin-bottom: 18px; padding: 0 10px;
    }
    .kids-choices {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; width: 100%; max-width: 420px;
    }
    .kids-choice-btn {
      min-height: 64px; font-size: clamp(1.3rem, 5.5vw, 2rem);
      font-weight: 900; border-radius: 18px;
      background: rgba(255,255,255,0.1); color: #fff;
      border: 2px solid rgba(255,255,255,0.2); cursor: pointer;
      transition: transform 0.15s, background 0.15s; font-family: inherit;
      display: flex; align-items: center; justify-content: center;
      letter-spacing: 0.06em; padding: 8px;
    }
    .kids-choice-btn:hover:not(:disabled) { background: rgba(255,215,0,0.2); transform: scale(1.05); }
    .kids-choice-btn:disabled { cursor: default; }
    .kids-choice-btn.kids-correct { background: #2e7d32 !important; border-color: #43a047 !important; }
    .kids-choice-btn.kids-wrong   { background: #b71c1c !important; border-color: #e53935 !important; }

    /* ── Reveal area ── */
    .kids-reveal-area {
      display: flex; gap: 10px; justify-content: center;
      margin: 16px 0 8px; flex-wrap: wrap;
    }
    .char-slot {
      font-size: clamp(2.2rem, 9vw, 3rem); font-weight: 900; color: #FFD700;
      display: inline-flex; align-items: center; justify-content: center;
      width: clamp(52px, 14vw, 70px); height: clamp(52px, 14vw, 70px);
      background: rgba(255,255,255,0.08); border-radius: 14px;
      transform: scale(0); transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .char-slot.revealed { transform: scale(1); }

    /* ── Summary screen ── */
    .kids-summary {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 24px 20px; width: 100%; max-width: 400px;
    }
    .kids-summary-title { font-size: 1.6rem; font-weight: 900; color: #FFD700; margin-bottom: 8px; }
    .kids-stars-row { font-size: 3rem; letter-spacing: 0.15em; margin: 12px 0; }
    .kids-stars-row span { display: inline-block; transform: scale(0); }
    .kids-stars-row span.star-in { animation: starBurst 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .kids-score-text { font-size: 1rem; color: #aac4e8; margin-bottom: 24px; }
    .kids-summary-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .kids-summary-btn {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; border-radius: 24px; padding: 12px 28px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: background 0.15s, transform 0.15s; font-family: inherit;
    }
    .kids-summary-btn:hover { background: rgba(255,215,0,0.25); transform: scale(1.04); }
    .kids-summary-btn.primary { background: var(--yellow); color: #1A1A2E; }
    .kids-summary-btn.primary:hover { background: var(--yellow-dark); }

    .kids-unlock-banner {
      background: linear-gradient(135deg, #FFD700, #FF8C00);
      color: #1A1A2E; font-weight: 800; font-size: 1rem;
      border-radius: 16px; padding: 12px 20px; margin-bottom: 16px;
      animation: kidsBounce 0.5s ease forwards;
    }

    /* ── Progress bar ── */
    .kids-progress-bar-wrap {
      width: 100%; max-width: 420px; height: 6px;
      background: rgba(255,255,255,0.12); border-radius: 3px; margin-bottom: 16px; flex-shrink: 0;
    }
    .kids-progress-bar {
      height: 100%; background: var(--yellow); border-radius: 3px;
      transition: width 0.4s ease;
    }

    /* ── Keyframes ── */
    @keyframes kidsBounce {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.4); }
      60%  { transform: scale(0.9); }
      80%  { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    @keyframes kidsShake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-8px); }
      40%     { transform: translateX(8px); }
      60%     { transform: translateX(-6px); }
      80%     { transform: translateX(6px); }
    }
    @keyframes charPop {
      0%   { transform: scale(0) rotate(-10deg); }
      60%  { transform: scale(1.35) rotate(4deg); }
      80%  { transform: scale(0.9) rotate(-2deg); }
      100% { transform: scale(1) rotate(0); }
    }
    @keyframes starBurst {
      0%   { transform: scale(0); opacity: 0; }
      60%  { transform: scale(1.5); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="pokeball-icon"></div>
    <div class="brand-text">
      <h1 id="appTitle">寶可夢識字樂</h1>
      <p id="appSubtitle">點擊文字，聆聽粵語・普通話發音</p>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button id="kidsBtn" onclick="enterKidsMode()">👶 小朋友</button>
    <button id="quizBtn" onclick="enterQuiz()">測驗</button>
    <button id="langToggle">English</button>
  </div>
</header>

<div id="setBanner">
  <div>
    <div class="set-title" id="setTitle">寶可夢卡牌151</div>
    <div class="set-subtitle" id="setSubtitle">Pokémon Card 151 · SV2a</div>
  </div>
  <div class="set-count" id="setCount">載入中…</div>
</div>

<div class="intro-tip" id="introTip">
  👆 點擊任何卡牌查看詳情，再點擊「粵」聽粵語、「普」聽普通話！
</div>

<main>
  <div id="cardGrid"></div>
</main>

<div id="backdrop"></div>

<!-- ── Quiz overlay ── -->
<div id="quizOverlay">
  <div class="quiz-top-bar">
    <button class="quiz-exit-btn" onclick="exitQuiz()">✕</button>
    <h2 class="quiz-title" id="quizTitle">測驗模式</h2>
    <span class="quiz-progress" id="quizProgress">…</span>
  </div>

  <div class="flashcard-wrap">
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="flashcard-face flashcard-front">
        <div class="fc-chars" id="fcChars"></div>
        <div class="fc-hint" id="fcHint">點擊翻牌 👆</div>
      </div>
      <div class="flashcard-face flashcard-back">
        <div class="fc-chars" id="fcCharsBack"></div>
        <div class="fc-sound-row">
          <button class="fc-sound-btn" onclick="event.stopPropagation();quizSpeak('cantonese')" title="粵語">🔊 粵</button>
          <button class="fc-sound-btn fc-sound-btn-mandarin" onclick="event.stopPropagation();quizSpeak('mandarin')" title="普通話">🔊 普</button>
        </div>
        <div class="fc-en" id="fcEn"></div>
        <span class="fc-tag" id="fcTag"></span>
      </div>
    </div>
  </div>

  <div class="quiz-nav-row">
    <button class="quiz-nav-btn" id="quizPrevBtn" onclick="quizNav(-1)" disabled>
      &#8592; <span id="quizPrevLabel">上一題</span>
    </button>
    <button class="quiz-nav-btn" id="quizNextBtn" onclick="quizNav(1)">
      <span id="quizNextLabel">下一題</span> &#8594;
    </button>
  </div>
</div>

<!-- ── Kids Mode overlay ── -->
<div id="kidsOverlay">
  <div class="kids-top-bar">
    <button class="quiz-exit-btn" onclick="exitKidsMode()">✕</button>
    <h2 class="kids-title">👶 小朋友識字</h2>
    <span class="kids-score-display" id="kidsScoreDisplay">⭐ 0</span>
  </div>
  <div id="kidsBody"></div>
</div>

<div id="detailPanel">
  <div class="panel-handle"></div>
  <div class="panel-nav">
    <button class="nav-btn" id="prevBtn" onclick="navigateCard(-1)" disabled>&#8592; <span id="prevLabel">上一張</span></button>
    <span class="nav-counter" id="navCounter"></span>
    <button class="nav-btn" id="nextBtn" onclick="navigateCard(1)"><span id="nextLabel">下一張</span> &#8594;</button>
  </div>
  <div id="panelContent"></div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────────────
const ZH_SET = 'SV2a';
const EN_SET = 'sv03.5';
const API    = 'https://api.tcgdex.net/v2';

// Trainer cards 152–165 appear in different sort order between the two sets.
// Map: zh localId → en localId for each trainer card.
const TRAINER_ZH_TO_EN = {
  '152': '159',  // 能量貼紙     ↔ Energy Sticker
  '153': '162',  // 抓換臂      ↔ Grabber
  '154': '152',  // 陳舊的貝殼化石 ↔ Antique Dome Fossil
  '155': '153',  // 陳舊的甲殼化石 ↔ Antique Helix Fossil
  '156': '154',  // 陳舊的秘密琥珀 ↔ Antique Old Amber
  '157': '164',  // 安全護目鏡   ↔ Protective Goggles
  '158': '155',  // 大氣球      ↔ Big Air Balloon
  '159': '165',  // 硬硬束帶    ↔ Rigid Band
  '160': '163',  // 吃剩的東西   ↔ Leftovers
  '161': '160',  // 莉佳的招待   ↔ Erika's Invitation
  '162': '161',  // 坂木的領導力  ↔ Giovanni's Charisma
  '163': '158',  // 奈奈美的幫助  ↔ Daisy's Help
  '164': '156',  // 正輝的輸送   ↔ Bill's Transfer
  '165': '157',  // 自行車道    ↔ Cycling Road
};

const TYPE_ICONS = {
  Grass:'🌿', Fire:'🔥', Water:'💧', Lightning:'⚡',
  Psychic:'🔮', Fighting:'👊', Darkness:'🌑', Metal:'⚙️',
  Dragon:'🐉', Colorless:'⭐', Fairy:'✨'
};

const TYPE_ZH = {
  Grass:'草系', Fire:'火系', Water:'水系', Lightning:'電系',
  Psychic:'超能系', Fighting:'格鬥系', Darkness:'惡系', Metal:'鋼系',
  Dragon:'龍系', Colorless:'無色', Fairy:'妖精系'
};

const STAGE_ZH = { Basic:'基本', Stage1:'一階', Stage2:'二階', VMAX:'VMAX', V:'V' };
const CATEGORY_ZH = { Pokemon:'寶可夢', Trainer:'訓練家', Energy:'能量' };

const LABELS = {
  zh: {
    appTitle: '寶可夢識字樂', appSubtitle: '點擊文字，聆聽粵語・普通話發音',
    intro: '👆 點擊任何卡牌查看詳情，再點擊「粵」聽粵語、「普」聽普通話！',
    toggleBtn: 'English', setTitle: '寶可夢卡牌151', setSubtitle: 'Pokémon Card 151 · SV2a',
    hp: 'HP', stage: '進化階段', ability: '特技', abilityTag: '寶可夢特技',
    attacks: '招式', stats: '弱點與撤退', weakness: '弱點', retreat: '撤退費用',
    retreatUnit: '張能量', description: '寶可夢說明', effect: '效果',
    loading: '載入中…', loadingCard: '正在載入卡牌資料…',
    cardsLoaded: n => `${n} 張卡牌`,
    error: '無法載入資料，請檢查網路連線後重試。',
    errorCard: '無法載入此卡牌資料。',
  },
  en: {
    appTitle: 'Pokémon Reading Fun', appSubtitle: 'Tap text to hear it read aloud',
    intro: '👆 Tap any card to see details, then tap text to hear it read aloud!',
    toggleBtn: '繁中', setTitle: 'Pokémon Card 151', setSubtitle: '寶可夢卡牌151 · SV2a',
    hp: 'HP', stage: 'Stage', ability: 'Ability', abilityTag: 'Pokémon Power',
    attacks: 'Attacks', stats: 'Weakness & Retreat', weakness: 'Weakness', retreat: 'Retreat Cost',
    retreatUnit: ' Energy', description: 'Pokédex Entry', effect: 'Effect',
    loading: 'Loading…', loadingCard: 'Loading card data…',
    cardsLoaded: n => `${n} cards`,
    error: 'Could not load data. Please check your connection and try again.',
    errorCard: 'Could not load this card.',
  }
};

// ── State ──────────────────────────────────────────────────────────
let lang             = 'zh';
let gridCards        = [];
let detailCache      = {};
let activeReading    = null;
let cantonVoice      = null;
let mandarinVoice    = null;
let currentCardIndex = -1;

// ── TTS ────────────────────────────────────────────────────────────
function initTTS() {
  if (!('speechSynthesis' in window)) return;
  function loadVoices() {
    const v = speechSynthesis.getVoices();
    cantonVoice =
      v.find(x => x.lang === 'zh-HK') ||
      v.find(x => x.lang.toLowerCase().includes('zh-hk')) ||
      v.find(x => x.lang.toLowerCase().includes('yue')) ||
      v.find(x => x.lang === 'zh-TW') ||
      v.find(x => x.lang.startsWith('zh')) || null;
    mandarinVoice =
      v.find(x => x.lang === 'zh-TW') ||
      v.find(x => x.lang === 'zh-CN') ||
      v.find(x => x.lang.toLowerCase().includes('zh-tw')) ||
      v.find(x => x.lang.toLowerCase().includes('zh-cn')) ||
      v.find(x => x.lang.startsWith('zh')) || null;
  }
  loadVoices();
  if (speechSynthesis.onvoiceschanged !== undefined)
    speechSynthesis.onvoiceschanged = loadVoices;
}

// dialect: 'cantonese' | 'mandarin' | 'english'
function speak(text, el, dialect) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  if (activeReading && activeReading !== el) activeReading.classList.remove('speaking');
  if (activeReading === el && el.classList.contains('speaking')) {
    el.classList.remove('speaking'); activeReading = null; return;
  }
  activeReading = el;
  el.classList.add('speaking');
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = 0.82;
  if (dialect === 'english') {
    utt.lang = 'en-US';
  } else if (dialect === 'mandarin') {
    utt.lang = 'zh-TW';
    if (mandarinVoice) utt.voice = mandarinVoice;
  } else {
    utt.lang = 'zh-HK';
    if (cantonVoice) utt.voice = cantonVoice;
  }
  utt.onend = utt.onerror = () => { el.classList.remove('speaking'); activeReading = null; };
  speechSynthesis.speak(utt);
}

function speakEl(el, text, dialect) { speak(text, el, dialect); }

// ── Fetch helper ───────────────────────────────────────────────────
async function fetchJSON(url) {
  const res  = await fetch(url);
  if (!res.ok) throw new Error(`${res.status} ${url}`);
  const data = await res.json();
  if (data && data.status >= 400) throw new Error(`API error ${data.status}`);
  return data;
}

// ── Init ───────────────────────────────────────────────────────────
async function init() {
  showSkeletons(12);
  try {
    const [zhSet, enSet] = await Promise.all([
      fetchJSON(`${API}/zh-tw/sets/${ZH_SET}`),
      fetchJSON(`${API}/en/sets/${EN_SET}`)
    ]);

    // Build en localId → card lookup
    const enByLocal = {};
    for (const c of (enSet.cards || [])) enByLocal[c.localId] = c;

    gridCards = (zhSet.cards || [])
      // Exclude localIds 181–207: these illustration rares have different ordering
      // between the Asian (SV2a) and English (sv03.5) releases.
      .filter(zh => parseInt(zh.localId) <= 180)
      .map(zh => {
        const n   = parseInt(zh.localId);
        // Trainer cards 152–165 are sorted differently; remap to the correct en card.
        const enLocalId = (n >= 152 && n <= 165) ? TRAINER_ZH_TO_EN[zh.localId] : zh.localId;
        const en  = enByLocal[enLocalId] || {};
        return {
          localId:  zh.localId,
          id_zh:    zh.id,
          id_en:    en.id   || null,
          name_zh:  zh.name,
          name_en:  en.name || zh.name,
          image_en: en.image || '',
        };
      });

    document.getElementById('setCount').textContent =
      LABELS[lang].cardsLoaded(gridCards.length);

    renderGrid();
  } catch (err) {
    console.error(err);
    document.getElementById('cardGrid').innerHTML =
      `<div class="error-notice">${LABELS[lang].error}</div>`;
    document.getElementById('setCount').textContent = '—';
  }
}

// ── Grid ───────────────────────────────────────────────────────────
function showSkeletons(n) {
  document.getElementById('cardGrid').innerHTML =
    Array.from({length: n}, () => `<div class="skeleton skeleton-card"></div>`).join('');
}

function renderGrid() {
  if (!gridCards.length) return;
  document.getElementById('cardGrid').innerHTML = gridCards.map(c => {
    const name = lang === 'zh' ? c.name_zh : c.name_en;
    const sub  = lang === 'zh' ? c.name_en : c.name_zh;
    const img  = c.image_en ? `${c.image_en}/low.webp` : '';
    return `
      <div class="card-thumb" onclick="openCard('${c.localId}')"
           role="button" tabindex="0" aria-label="${name}">
        <img src="${img}" alt="${name}" loading="lazy"
             onerror="this.style.background='#eee';this.removeAttribute('src')">
        <div class="card-thumb-label">
          <span class="name-zh">${name}</span>
          <span class="name-en">${sub}</span>
        </div>
      </div>`;
  }).join('');
}

// ── Card detail ────────────────────────────────────────────────────
function updateNav() {
  document.getElementById('prevBtn').disabled = currentCardIndex <= 0;
  document.getElementById('nextBtn').disabled = currentCardIndex >= gridCards.length - 1;
  document.getElementById('navCounter').textContent =
    gridCards.length ? `${currentCardIndex + 1} / ${gridCards.length}` : '';
}

function navigateCard(delta) {
  const next = currentCardIndex + delta;
  if (next < 0 || next >= gridCards.length) return;
  openCard(gridCards[next].localId);
}

async function openCard(localId) {
  currentCardIndex = gridCards.findIndex(c => c.localId === localId);
  updateNav();
  document.getElementById('detailPanel').classList.add('active');
  document.getElementById('backdrop').classList.add('active');
  document.getElementById('panelContent').innerHTML = `
    <div class="panel-spinner">
      <div class="spinner"></div>
      <div class="spinner-label">${LABELS[lang].loadingCard}</div>
    </div>`;

  try {
    if (!detailCache[localId]) {
      const card = gridCards.find(c => c.localId === localId);
      if (!card) throw new Error('card not in grid');

      const [zh, en] = await Promise.all([
        fetchJSON(`${API}/zh-tw/cards/${card.id_zh}`),
        card.id_en ? fetchJSON(`${API}/en/cards/${card.id_en}`) : Promise.resolve(null)
      ]);
      detailCache[localId] = { zh, en };
    }
    renderDetail(localId, detailCache[localId]);
  } catch (err) {
    console.error(err);
    document.getElementById('panelContent').innerHTML = `
      <div style="padding:20px">
        <button class="close-btn" onclick="closePanel()" style="margin-bottom:12px">✕</button>
        <div class="error-notice">${LABELS[lang].errorCard}</div>
      </div>`;
  }
}

// ── Detail renderer ────────────────────────────────────────────────
function renderDetail(localId, { zh: zhCard, en: enCard }) {
  const lbl  = LABELS[lang];
  const isEn = lang === 'en';

  const name        = isEn ? (enCard?.name || zhCard.name)   : zhCard.name;
  const description = isEn ? (enCard?.description || '')     : (zhCard.description || '');
  const category    = zhCard.category;
  const isPokemon   = category === 'Pokemon';

  const gridCard = gridCards.find(c => c.localId === localId);
  const imgUrl   = gridCard?.image_en ? `${gridCard.image_en}/high.webp` : '';

  function readable(text, cls = '') {
    if (!text) return '';
    const esc = text.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    if (!isEn) {
      // Chinese mode: Cantonese (粵) + Mandarin (普) buttons
      return `<div class="readable ${cls}" onclick="speakEl(this,'${esc}','cantonese')" role="button">
        <button class="speaker-btn" tabindex="-1" title="粵語">粵</button>
        <button class="speaker-btn speaker-btn-mandarin" tabindex="-1" title="普通話"
                onclick="event.stopPropagation();speak('${esc}',this.closest('.readable'),'mandarin')">普</button>
        <span class="readable-text">${text}</span>
      </div>`;
    }
    return `<div class="readable ${cls}" onclick="speakEl(this,'${esc}','english')" role="button">
      <button class="speaker-btn" tabindex="-1">🔊</button>
      <span class="readable-text">${text}</span>
    </div>`;
  }

  // Type badge(s)
  let typeHTML = '';
  if (isPokemon && zhCard.types?.length) {
    typeHTML = zhCard.types.map(t => {
      const label = isEn ? t : (TYPE_ZH[t] || t);
      return `<span class="type-badge type-${t}">${TYPE_ICONS[t] || '⭐'} ${label}</span>`;
    }).join(' ');
  }

  const stageRaw   = zhCard.stage || '';
  const stageLabel = isEn ? stageRaw : (STAGE_ZH[stageRaw] || stageRaw);

  const headerHTML = `
    <div class="panel-header">
      <img class="panel-card-img" src="${imgUrl}" alt="${name}"
           onerror="this.style.display='none'">
      <div class="panel-card-info">
        <div class="panel-name">${readable(name)}</div>
        ${typeHTML ? `<div style="margin:4px 0">${typeHTML}</div>` : ''}
        ${isPokemon && stageLabel ? `<div class="panel-stage">${stageLabel}</div>` : ''}
        ${isPokemon && zhCard.hp  ? `<div class="panel-hp">${lbl.hp} <span>${zhCard.hp}</span></div>` : ''}
        ${!isPokemon ? `<span class="trainer-tag">${isEn ? category : (CATEGORY_ZH[category] || category)}</span>` : ''}
      </div>
      <button class="close-btn" onclick="closePanel()" aria-label="Close">✕</button>
    </div>`;

  // Pokédex description
  let descHTML = '';
  if (description) {
    descHTML = `<div class="section-label">${lbl.description}</div>
      <div class="flavor-text">${readable(description)}</div>`;
  }

  // Abilities
  let abilitiesHTML = '';
  const abilities = isEn ? (enCard?.abilities || zhCard.abilities || []) : (zhCard.abilities || []);
  if (isPokemon && abilities.length) {
    abilitiesHTML = `<div class="section-label">${lbl.ability}</div>`;
    abilities.forEach(ab => {
      abilitiesHTML += `
        <div class="ability-block">
          <span class="ability-tag">${lbl.abilityTag}</span>
          ${readable(ab.name, 'ability-name')}
          ${ab.effect ? readable(ab.effect, 'ability-effect') : ''}
        </div>`;
    });
  }

  // Attacks
  let attacksHTML = '';
  const attacks = isEn ? (enCard?.attacks || zhCard.attacks || []) : (zhCard.attacks || []);
  if (isPokemon && attacks.length) {
    attacksHTML = `<div class="section-label">${lbl.attacks}</div>`;
    attacks.forEach(atk => {
      const dmg      = atk.damage != null && atk.damage !== 0 ? atk.damage : '';
      const costPips = (atk.cost || []).map(t =>
        `<span class="energy-pip energy-${t}">${TYPE_ICONS[t] || '●'}</span>`
      ).join('');
      attacksHTML += `
        <div class="attack-block">
          <div class="attack-row attack-name-row">
            <div class="attack-cost">${costPips}</div>
            ${readable(atk.name, 'attack-name')}
            ${dmg ? `<div class="attack-damage">${dmg}</div>` : ''}
          </div>
          ${atk.effect ? `<div class="attack-row">${readable(atk.effect, 'attack-effect')}</div>` : ''}
        </div>`;
    });
  }

  // Trainer / Energy effect
  let trainerHTML = '';
  if (!isPokemon) {
    const effect = isEn ? (enCard?.effect || zhCard.effect || '') : (zhCard.effect || '');
    if (effect) {
      trainerHTML = `<div class="section-label">${lbl.effect}</div>
        <div class="trainer-effect">${readable(effect)}</div>`;
    }
  }

  // Weakness + retreat
  let statsHTML = '';
  if (isPokemon) {
    const weaknesses = zhCard.weaknesses || [];
    const retreatNum  = zhCard.retreat ?? 0;
    const retreatText = retreatNum === 0
      ? (isEn ? 'Free' : '免費')
      : `${retreatNum}${lbl.retreatUnit}`;
    const weakText = weaknesses.map(w => {
      const tLabel = isEn ? w.type : (TYPE_ZH[w.type] || w.type);
      return `${TYPE_ICONS[w.type] || ''} ${tLabel} ${w.value}`;
    }).join(', ') || (isEn ? 'None' : '無');

    statsHTML = `
      <div class="section-label">${lbl.stats}</div>
      <div class="stats-row">
        <div class="stat-chip"><strong>${lbl.weakness}</strong>${weakText}</div>
        <div class="stat-chip"><strong>${lbl.retreat}</strong>${retreatText}</div>
      </div>`;
  }

  document.getElementById('panelContent').innerHTML =
    headerHTML +
    `<div class="panel-body">${descHTML}${abilitiesHTML}${attacksHTML}${trainerHTML}${statsHTML}</div>`;
}

  if (document.getElementById('kidsOverlay').classList.contains('active')) {
    if (e.key === 'Escape') exitKidsMode();

    if (e.key === 'Escape')     exitQuiz();
    if (e.key === 'ArrowLeft')  quizNav(-1);
    if (e.key === 'ArrowRight') quizNav(1);

    if (e.key === 'ArrowLeft')  navigateCard(-1);
    if (e.key === 'ArrowRight') navigateCard(1);

});

// ── Quiz ──────────────────────────────────────────────────────────

const VOCAB_CAT = {
  name:    { zh: '名稱',  en: 'Name'    },
  move:    { zh: '招式',  en: 'Move'    },
  ability: { zh: '特技',  en: 'Ability' },
};

// Cards pre-fetched at quiz entry to seed move vocabulary
const PREFETCH_IDS = ['006','009','025','054','094','113','131','143','150','151'];

let quizVocab   = [];
let quizIndex   = 0;
let quizFlipped = false;

function chineseOnly(str) {
  return (str || '').replace(/[^一-鿿]/g, '');
}

function buildVocabList() {
  const seen  = new Set();
  const vocab = [];

  function add(zhRaw, enRaw, catKey) {
    const zh = chineseOnly(zhRaw);
    if (!zh || zh.length > 4) return;
    if (seen.has(zh)) return;
    seen.add(zh);
    vocab.push({ zh, en: enRaw || '—', cat: catKey });
  }

  // Card names (always available)
  for (const c of gridCards) add(c.name_zh, c.name_en, 'name');

  // Moves + abilities from any already-cached card details
  for (const { zh: zc, en: ec } of Object.values(detailCache)) {
    (zc.attacks  || []).forEach((a, i) => add(a.name, ec?.attacks?.[i]?.name,   'move'));
    (zc.abilities|| []).forEach((a, i) => add(a.name, ec?.abilities?.[i]?.name, 'ability'));
  }

  // Fisher-Yates shuffle
  for (let i = vocab.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [vocab[i], vocab[j]] = [vocab[j], vocab[i]];
  }
  return vocab;
}

async function enterQuiz() {
  // Show overlay immediately with names vocab
  quizVocab   = buildVocabList();
  quizIndex   = 0;
  quizFlipped = false;
  // Sync header labels to current language before showing
  const isEn = lang === 'en';
  document.getElementById('quizTitle').textContent     = isEn ? 'Quiz Mode' : '測驗模式';
  document.getElementById('quizPrevLabel').textContent = isEn ? 'Prev' : '上一題';
  document.getElementById('quizNextLabel').textContent = isEn ? 'Next' : '下一題';
  document.getElementById('quizOverlay').classList.add('active');
  renderQuizCard();
  updateQuizProgress();

  // Background-fetch 10 representative cards for move vocab
  const uncached = PREFETCH_IDS.filter(id =>
    !detailCache[id] && gridCards.find(c => c.localId === id));
  if (uncached.length) {
    try {
      await Promise.all(uncached.map(async localId => {
        const card = gridCards.find(c => c.localId === localId);
        const [zh, en] = await Promise.all([
          fetchJSON(`${API}/zh-tw/cards/${card.id_zh}`),
          card.id_en ? fetchJSON(`${API}/en/cards/${card.id_en}`) : Promise.resolve(null),
        ]);
        detailCache[localId] = { zh, en };
      }));
      // Rebuild with richer vocab, preserve current card
      const currentZh = quizVocab[quizIndex]?.zh;
      quizVocab = buildVocabList();
      const restored = quizVocab.findIndex(v => v.zh === currentZh);
      quizIndex = restored >= 0 ? restored : 0;
      updateQuizProgress();
    } catch (_) { /* silently ignore — names vocab still works */ }
  }
}

function exitQuiz() {
  speechSynthesis && speechSynthesis.cancel();
  document.getElementById('quizOverlay').classList.remove('active');
}

function renderQuizCard() {
  if (!quizVocab.length) return;
  const item = quizVocab[quizIndex];
  const isEn = lang === 'en';

  // Front: English word in EN mode, Chinese characters in ZH mode
  const frontEl = document.getElementById('fcChars');
  frontEl.textContent = isEn ? item.en : item.zh;
  // Shrink font for longer English words so they fit the card
  frontEl.style.fontSize = (isEn && item.en.length > 10) ? 'clamp(1.4rem,5vw,2rem)'
                         : (isEn && item.en.length > 6)  ? 'clamp(1.8rem,6vw,2.6rem)'
                         : '';

  document.getElementById('fcHint').textContent = isEn ? 'Tap to flip 👆' : '點擊翻牌 👆';

  // Back: always show Chinese big + English small, regardless of mode
  document.getElementById('fcCharsBack').textContent = item.zh;
  document.getElementById('fcEn').textContent        = item.en;
  document.getElementById('fcTag').textContent       = VOCAB_CAT[item.cat]?.[lang] || item.cat;

  // Sync nav button labels with current language
  const isEnNow = lang === 'en';
  document.getElementById('quizPrevLabel').textContent = isEnNow ? 'Prev' : '上一題';
  document.getElementById('quizNextLabel').textContent = isEnNow ? 'Next' : '下一題';

  // Reset flip
  document.getElementById('flashcard').classList.remove('flipped');
  quizFlipped = false;
}

function quizSpeak(dialect) {
  if (!('speechSynthesis' in window) || !quizVocab.length) return;
  const item = quizVocab[quizIndex];
  speechSynthesis.cancel();
  const text = (dialect === 'english') ? item.en : item.zh;
  if (!text || text === '—') return;
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = 0.82;
  if (dialect === 'mandarin') {
    utt.lang = 'zh-TW';
    if (mandarinVoice) utt.voice = mandarinVoice;
  } else if (dialect === 'english') {
    utt.lang = 'en-US';
  } else {
    utt.lang = 'zh-HK';
    if (cantonVoice) utt.voice = cantonVoice;
  }
  speechSynthesis.speak(utt);
}

function flipCard() {
  quizFlipped = !quizFlipped;
  document.getElementById('flashcard').classList.toggle('flipped', quizFlipped);

  if (quizFlipped && 'speechSynthesis' in window) {
    const item = quizVocab[quizIndex];
    speechSynthesis.cancel();

    // Auto-play Cantonese first, then English
    if (item.zh) {
      const uttZh = new SpeechSynthesisUtterance(item.zh);
      uttZh.rate = 0.82;
      uttZh.lang = 'zh-HK';
      if (cantonVoice) uttZh.voice = cantonVoice;
      speechSynthesis.speak(uttZh);
    }
    if (item.en && item.en !== '—') {
      const uttEn = new SpeechSynthesisUtterance(item.en);
      uttEn.rate = 0.82;
      uttEn.lang = 'en-US';
      speechSynthesis.speak(uttEn); // queued after Cantonese finishes
    }
  }
}

function quizNav(delta) {
  const next = quizIndex + delta;
  if (next < 0 || next >= quizVocab.length) return;
  speechSynthesis && speechSynthesis.cancel();
  quizIndex = next;
  renderQuizCard();
  updateQuizProgress();
}

function updateQuizProgress() {
  document.getElementById('quizProgress').textContent =
    quizVocab.length ? `${quizIndex + 1} / ${quizVocab.length}` : '—';
  document.getElementById('quizPrevBtn').disabled = quizIndex <= 0;
  document.getElementById('quizNextBtn').disabled = quizIndex >= quizVocab.length - 1;
}

// Kids Mode state
let kidsLevel    = 1;
let kidsSession  = [];
let kidsQIndex   = 0;
let kidsScore    = 0;
let kidsProgress = {};
let _kidsTimers  = [];

function kidsClearTimers() { _kidsTimers.forEach(clearTimeout); _kidsTimers = []; }
function kidsTimer(fn, ms) { const t = setTimeout(fn, ms); _kidsTimers.push(t); return t; }

function kidsSaveProgress() {
  try { localStorage.setItem('kids_progress', JSON.stringify(kidsProgress)); } catch(_) {}
}
function kidsLoadProgress() {
  try { kidsProgress = JSON.parse(localStorage.getItem('kids_progress') || '{}'); } catch(_) { kidsProgress = {}; }
}

function kidsLevelPool(level) {
  // Only Pokémon cards, filter by char length per level
  const pkVocab = M4_VOCAB.filter(v => v.pk);
  if (level === 1) return pkVocab.filter(v => v.zh.length <= 2);
  if (level === 2) return pkVocab.filter(v => v.zh.length === 3);
  return pkVocab.filter(v => v.zh.length === 4);
}

function kidsShuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function kidsGetDistractors(correct, pool, n) {
  const others = kidsShuffle(pool.filter(v => v.zh !== correct.zh));
  return others.slice(0, n);
}

function enterKidsMode() {
  kidsLoadProgress();
  document.getElementById('kidsOverlay').classList.add('active');
  kidsRenderLevelSelector();
}

function exitKidsMode() {
  kidsClearTimers();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.getElementById('kidsOverlay').classList.remove('active');
}

function kidsRenderLevelSelector() {
  const levels = [
    { n:1, icon:'🌱', name:'入門', desc:'1–2個字', color:'#2e7d32' },
    { n:2, icon:'⚡', name:'進階', desc:'3個字',   color:'#e65100' },
    { n:3, icon:'🔥', name:'高手', desc:'4個字',   color:'#b71c1c' },
  ];
  const prog = kidsProgress;
  // Level 2 needs 2 completed Level-1 sessions; Level 3 needs 2 Level-2 sessions
  const l2Unlocked = (prog.l1sessions || 0) >= 2;
  const l3Unlocked = (prog.l2sessions || 0) >= 2;
  const unlocked = [true, l2Unlocked, l3Unlocked];

  const cardsHtml = levels.map((lv, i) => {
    const locked = !unlocked[i];
    const stars  = prog[`l${lv.n}stars`] || 0;
    const starsHtml = stars > 0 ? '⭐'.repeat(stars) : '—';
    return `
      <div class="kids-level-card ${locked ? 'kids-locked' : ''}"
           onclick="${locked ? '' : `kidsStartSession(${lv.n})`}">
        <div class="kids-level-icon">${lv.icon}</div>
        <div class="kids-level-info">
          <div class="kids-level-name">等級 ${lv.n}：${lv.name}</div>
          <div class="kids-level-desc">${lv.desc} ${locked ? '🔒 需先完成上一等級兩次' : ''}</div>
        </div>
        <div class="kids-level-stars">${starsHtml}</div>
      </div>`;
  }).join('');

  document.getElementById('kidsBody').innerHTML = `
    <div style="color:#fff;font-size:1rem;font-weight:700;text-align:center;padding:8px 0 16px">
      選擇等級
    </div>
    <div class="kids-level-grid">${cardsHtml}</div>`;
  document.getElementById('kidsScoreDisplay').textContent = '';
}

function kidsStartSession(level) {
  kidsClearTimers();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  kidsLevel   = level;
  kidsQIndex  = 0;
  kidsScore   = 0;
  const pool  = kidsLevelPool(level);
  kidsSession = kidsShuffle(pool).slice(0, 8);
  document.getElementById('kidsScoreDisplay').textContent = `⭐ 0`;
  kidsRenderQuestion();
}

function kidsRenderQuestion() {
  if (!kidsSession.length) return;
  const item = kidsSession[kidsQIndex];
  const pool = kidsLevelPool(kidsLevel);

  // Build 4 choices: correct + 3 distractors, shuffled
  const distractors = kidsGetDistractors(item, pool, 3);
  const choices     = kidsShuffle([item, ...distractors]);

  const qLabel = item.cat === 'name'    ? '這隻寶可夢叫什麼名字？'
               : item.cat === 'move'    ? '這個招式叫什麼名字？'
               :                          '這個特技叫什麼名字？';

  // Progress bar
  const pct = Math.round((kidsQIndex / 8) * 100);

  const choiceBtns = choices.map(c => {
    const esc = c.zh.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<button class="kids-choice-btn" onclick="kidsAnswer(this,'${esc}')">${c.zh}</button>`;
  }).join('');

  document.getElementById('kidsBody').innerHTML = `
    <div class="kids-progress-bar-wrap">
      <div class="kids-progress-bar" style="width:${pct}%"></div>
    </div>
    <img class="kids-card-img" src="${item.img}" alt="${item.zh}"
         onerror="this.style.opacity='0.3'">
    <div class="kids-question-label">${qLabel}</div>
    <div class="kids-choices">${choiceBtns}</div>
    <div class="kids-reveal-area" id="kidsRevealArea" style="display:none"></div>`;

  document.getElementById('kidsScoreDisplay').textContent = `⭐ ${kidsScore}`;
}

function kidsAnswer(btnEl, chosen) {
  kidsClearTimers();
  const item    = kidsSession[kidsQIndex];
  const correct = chosen === item.zh;

  // Disable all buttons immediately
  document.querySelectorAll('.kids-choice-btn').forEach(b => { b.disabled = true; });

  if (correct) {
    kidsScore++;
    btnEl.classList.add('kids-correct');
    btnEl.style.animation = 'kidsBounce 0.45s ease';
    document.getElementById('kidsScoreDisplay').textContent = `⭐ ${kidsScore}`;
    kidsPlayTone(523, 0.18);   // happy C5
    kidsTimer(() => kidsRevealChars(item.zh, () => kidsNextQuestion()), 400);
  } else {
    btnEl.classList.add('kids-wrong');
    btnEl.style.animation = 'kidsShake 0.4s ease';
    kidsPlayTone(196, 0.3);    // sad low G
    // Highlight the correct button
    document.querySelectorAll('.kids-choice-btn').forEach(b => {
      if (b.textContent === item.zh) b.classList.add('kids-correct');
    });
    kidsTimer(() => kidsNextQuestion(), 1800);
  }
}

function kidsRevealChars(word, onComplete) {
  const area = document.getElementById('kidsRevealArea');
  if (!area) { onComplete && onComplete(); return; }
  area.style.display = 'flex';
  area.innerHTML = [...word].map(() => `<span class="char-slot"></span>`).join('');
  const slots = area.querySelectorAll('.char-slot');

  let i = 0;
  function revealNext() {
    if (i >= word.length) {
      // Speak full word after individual chars
      if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        const utt = new SpeechSynthesisUtterance(word);
        utt.lang = 'zh-HK'; utt.rate = 0.75;
        if (cantonVoice) utt.voice = cantonVoice;
        utt.onend = () => { onComplete && onComplete(); };
        speechSynthesis.speak(utt);
        // Safety fallback
        kidsTimer(() => { onComplete && onComplete(); }, 2500);
      } else {
        kidsTimer(() => { onComplete && onComplete(); }, 600);
      }
      return;
    }
    slots[i].textContent = word[i];
    slots[i].classList.add('revealed');
    speakChar(word[i]);
    i++;
    kidsTimer(revealNext, 520);
  }
  revealNext();
}

function speakChar(char) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(char);
  utt.lang = 'zh-HK'; utt.rate = 0.7;
  if (cantonVoice) utt.voice = cantonVoice;
  speechSynthesis.speak(utt);
}

function kidsPlayTone(freq, duration) {
  try {
    const ctx  = new (window.AudioContext || window.webkitAudioContext)();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start(); osc.stop(ctx.currentTime + duration);
  } catch(_) {}
}

function kidsNextQuestion() {
  kidsClearTimers();
  kidsQIndex++;
  if (kidsQIndex < kidsSession.length) {
    kidsRenderQuestion();
  } else {
    kidsShowSummary();
  }
}

function kidsShowSummary() {
  const score = kidsScore;
  const stars = score >= 7 ? 3 : score >= 5 ? 2 : 1;
  const msg   = stars === 3 ? '太棒了！🎉' : stars === 2 ? '做得好！👍' : '再試一次！💪';

  // Update progress
  kidsLoadProgress();
  const lKey   = `l${kidsLevel}`;
  const sKey   = `l${kidsLevel}sessions`;
  const stKey  = `l${kidsLevel}stars`;
  kidsProgress[sKey]  = (kidsProgress[sKey]  || 0) + 1;
  kidsProgress[stKey] = Math.max(kidsProgress[stKey] || 0, stars);
  kidsSaveProgress();

  // Check level unlock
  const justUnlocked =
    (kidsLevel === 1 && kidsProgress.l1sessions === 2) ||
    (kidsLevel === 2 && kidsProgress.l2sessions === 2);
  const unlockMsg = justUnlocked
    ? `<div class="kids-unlock-banner">🎉 解鎖等級 ${kidsLevel + 1}！</div>` : '';

  document.getElementById('kidsBody').innerHTML = `
    <div class="kids-summary">
      ${unlockMsg}
      <div class="kids-summary-title">${msg}</div>
      <div class="kids-stars-row" id="kidsStarsRow">
        ${'⭐'.repeat(stars).split('').map(s => `<span>${s}</span>`).join('')}
        ${'☆'.repeat(3 - stars).split('').map(s => `<span style="opacity:.25">${s}</span>`).join('')}
      </div>
      <div class="kids-score-text">你答對了 ${score} / ${kidsSession.length} 題！</div>
      <div class="kids-summary-btns">
        <button class="kids-summary-btn" onclick="kidsStartSession(${kidsLevel})">再玩一次</button>
        <button class="kids-summary-btn primary" onclick="kidsRenderLevelSelector()">選關卡</button>
      </div>
    </div>`;

  document.getElementById('kidsScoreDisplay').textContent = '';

  // Animate stars in with stagger
  kidsTimer(() => {
    document.querySelectorAll('#kidsStarsRow span').forEach((el, i) => {
      kidsTimer(() => el.classList.add('star-in'), i * 220);
    });
  }, 150);

  // Play celebratory tones
  if (stars >= 2) {
    [523, 659, 784].forEach((f, i) => kidsTimer(() => kidsPlayTone(f, 0.2), i * 180));
  }
}

// ── Boot ───────────────────────────────────────────────────────────
initTTS();
init();
</script>
</body>
</html>
